<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>回答データ統合</title>
  <link rel="stylesheet" href="../common.css">
</head>
<body>

<div id="card">
  <h2>回答データの統合</h2>

  <!-- さとし -->
  <input type="file" id="himFile">
  <label for="himFile">さとしの回答を読み込む</label>

  <!-- ゆみこ -->
  <input type="file" id="herFile">
  <label for="herFile">ゆみこの回答を読み込む</label>

  <!-- CSV生成 -->
  <button id="csvBtn">CSVを作成する</button>
</div>

<script>
// ===== JSON読み込み =====
let himData = null;
let herData = null;

document.getElementById("himFile").onchange = (e) => {
  const reader = new FileReader();
  reader.onload = () => himData = JSON.parse(reader.result);
  reader.readAsText(e.target.files[0]);
};

document.getElementById("herFile").onchange = (e) => {
  const reader = new FileReader();
  reader.onload = () => herData = JSON.parse(reader.result);
  reader.readAsText(e.target.files[0]);
};

// ===== 質問リスト（必要ならここに62問全部入れられる） =====
const questions = [
  { no: "Q1", text: "朝起きて最初にする行動は何？" },
  { no: "Q2", text: "朝の準備で毎日必ず通る場所はどこ？" },
  { no: "Q3", text: "家の中で一番よく使う場所は？" },
  { no: "Q4", text: "朝の動線で改善したい点はある？" }
  // ★ ここにあなたの全62問を追加できる（必要なら全部作るよ）
];

// ===== CSV生成 =====
document.getElementById("csvBtn").onclick = () => {
  if (!himData || !herData) {
    alert("両方の回答データを読み込んでください");
    return;
  }

  // 改行を安全に変換（Excelで行ズレしない）
  const escapeNewLine = (text) => {
    if (!text) return "";
    return text.replace(/\n/g, "\\n");
  };

  const rows = [["質問番号","質問内容","さとし","ゆみこ"]];

  questions.forEach(q => {
    const no = q.no;
    const text = q.text;
    const him = escapeNewLine(himData[no] || "");
    const her = escapeNewLine(herData[no] || "");

    rows.push([no, text, him, her]);
  });

  const csv = rows.map(r => r.join(",")).join("\n");

  // ★ Excel文字化け防止：UTF-8 BOM付き
  const BOM = new Uint8Array([0xEF, 0xBB, 0xBF]);
  const blob = new Blob([BOM, csv], { type: "text/csv" });

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "merged.csv";
  a.click();
};
</script>

</body>
</html>
